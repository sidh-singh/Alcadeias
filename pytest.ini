[pytest]
# Test-suite of the backtester (tests/). Run from the repository root:
#
#   python3 -m pytest tests -q                         default suite (a few minutes)
#   python3 -m pytest tests -q -m slow                 only the full-window parity replays
#   python3 -m pytest tests -q -m "slow or not slow"   everything
#
# The slow tests are deselected by default through the -m in addopts; a -m given on the
# command line replaces it.
#
# ALCADEIAS_LIVE_ROOT=<dir> points the suite at another checkout of the live files
# (strategy.py, indicator.py, app.py, mt5_helper.py, constants.py, symbols.json), e.g. a
# worktree of a netting_* deployment branch. Default: this repository.
testpaths = tests
addopts = -m "not slow" --strict-markers -ra
markers =
    slow: replays a full fixture window through the real live loop (about a minute each); run with -m slow
